<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="795" viewBox="0 0 1240 795" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Central analysis storage lifecycle</title>
  <desc id="desc">On first use or during upgrade maintenance, legacy analysis data of a website is removed and reanalysis is requested. Content and storage analyses then write into isolated runs, publish a completed generation atomically and remove obsolete generations in bounded batches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker>
    <style>
      .box { fill: #f4f8fb; stroke: #52606d; stroke-width: 2; }
      .phase { fill: #e7f5ef; stroke: #16803c; stroke-width: 2; }
      .warning { fill: #fff4e5; stroke: #b45309; stroke-width: 2; }
      .stop { fill: #fdecec; stroke: #b42318; stroke-width: 2; }
      .decision { fill: #edf2ff; stroke: #3b5bdb; stroke-width: 2; }
      .group { fill: none; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .line { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #b42318; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .label { font: 600 16px Arial, sans-serif; fill: #1f2933; text-anchor: middle; dominant-baseline: middle; }
      .title { font: 700 24px Arial, sans-serif; fill: #1f2933; text-anchor: middle; }
      .small { font: 600 13px Arial, sans-serif; fill: #334e68; text-anchor: middle; dominant-baseline: middle; }
      .edge { font: 700 13px Arial, sans-serif; fill: #52606d; }
      .note { font: 600 13px Arial, sans-serif; fill: #52606d; }
    </style>
  </defs>
  <rect width="1240" height="795" fill="#fff"/>
  <text x="620.0" y="40" class="title">Central analysis storage: website upgrade, runs and publication</text>
  <rect x="445" y="80" width="350" height="70" rx="10" class="box"/>
  <text x="620.0" y="105.0" class="label">First use or upgrade maintenance</text>
  <text x="620.0" y="125.0" class="small">10 websites per maintenance step</text>
  <rect x="445" y="185" width="350" height="70" rx="10" class="warning"/>
  <text x="620.0" y="210.0" class="label">Delete legacy analysis data</text>
  <text x="620.0" y="230.0" class="small">without reading payloads</text>
  <path d="M 620.0 150 L 620.0 185" class="line"/>
  <rect x="445" y="290" width="350" height="70" rx="10" class="box"/>
  <text x="620.0" y="315.0" class="label">Mark reanalysis required</text>
  <text x="620.0" y="335.0" class="small">rrze_msm_analysis_reanalysis</text>
  <path d="M 620.0 255 L 620.0 290" class="line"/>
  <rect x="445" y="395" width="350" height="70" rx="10" class="box"/>
  <text x="620.0" y="420.0" class="label">Create isolated run</text>
  <text x="620.0" y="440.0" class="small">run_id, network_id, blog_id, slot</text>
  <path d="M 620.0 360 L 620.0 395" class="line"/>
  <rect x="40" y="500" width="560" height="250" rx="14" class="group"/>
  <text x="54" y="738" class="note">Content analysis (shortcodes and blocks)</text>
  <rect x="70" y="525" width="220" height="80" rx="10" class="phase"/>
  <text x="180.0" y="555.0" class="label">Shortcode findings</text>
  <text x="180.0" y="575.0" class="small">+ checkpoint, one transaction</text>
  <rect x="350" y="525" width="220" height="80" rx="10" class="phase"/>
  <text x="460.0" y="555.0" class="label">Block findings</text>
  <text x="460.0" y="575.0" class="small">+ checkpoint, one transaction</text>
  <path d="M 620 465 L 620 485 L 180 485 L 180.0 525" class="line"/>
  <path d="M 290 565.0 L 350 565.0" class="line"/>
  <rect x="70" y="635" width="500" height="75" rx="10" class="phase"/>
  <text x="320.0" y="662.5" class="label">Atomic publication of summary and generation</text>
  <text x="320.0" y="682.5" class="small">a failed publication keeps the previous result</text>
  <path d="M 460.0 605 L 460 635" class="line"/>
  <rect x="640" y="500" width="560" height="250" rx="14" class="group"/>
  <text x="654" y="738" class="note">Storage analysis</text>
  <rect x="670" y="525" width="500" height="80" rx="10" class="phase"/>
  <text x="920.0" y="555.0" class="label">Storage checkpoints and media-index segments</text>
  <text x="920.0" y="575.0" class="small">bounded segments 00–ff, u00–uff</text>
  <path d="M 620 485 L 920 485 L 920.0 525" class="line"/>
  <rect x="670" y="635" width="220" height="75" rx="10" class="phase"/>
  <text x="780.0" y="672.5" class="label">Publish bounded result</text>
  <rect x="950" y="635" width="220" height="75" rx="10" class="phase"/>
  <text x="1060.0" y="662.5" class="label">Retire run</text>
  <text x="1060.0" y="682.5" class="small">clear reanalysis flag</text>
  <path d="M 780 605 L 780.0 635" class="line"/>
  <path d="M 890 672.5 L 950 672.5" class="line"/>
  <rect x="890" y="80" width="310" height="110" rx="10" class="box"/>
  <text x="1045.0" y="105.0" class="label">Bounded deletion</text>
  <text x="1045.0" y="125.0" class="small">obsolete and expired generations,</text>
  <text x="1045.0" y="145.0" class="small">≤ 250 rows per table and run,</text>
  <text x="1045.0" y="165.0" class="small">hourly maintenance</text>
  <path d="M 70 672.5 L 22 672 L 22 62 L 1045 62 L 1045.0 80" class="line"/>
  <path d="M 1170 672.5 L 1220 672 L 1220 135 L 1200 135.0" class="line"/>
  <text x="30" y="778" class="note" text-anchor="start">Publication of a new generation marks the previous generation obsolete; maintenance removes it later.</text>
</svg>
