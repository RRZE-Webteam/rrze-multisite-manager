<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Worker admission and runtime statistics</title>
  <desc id="desc">A heavy background request tries to reserve one of the configured execution slots through connection-bound named locks. Without a free slot it records the postponement and schedules a retry. With a slot it runs one bounded step, releases the slot and records duration and memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker>
    <style>
      .box { fill: #f4f8fb; stroke: #52606d; stroke-width: 2; }
      .phase { fill: #e7f5ef; stroke: #16803c; stroke-width: 2; }
      .warning { fill: #fff4e5; stroke: #b45309; stroke-width: 2; }
      .stop { fill: #fdecec; stroke: #b42318; stroke-width: 2; }
      .decision { fill: #edf2ff; stroke: #3b5bdb; stroke-width: 2; }
      .group { fill: none; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .line { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #b42318; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .label { font: 600 16px Arial, sans-serif; fill: #1f2933; text-anchor: middle; dominant-baseline: middle; }
      .title { font: 700 24px Arial, sans-serif; fill: #1f2933; text-anchor: middle; }
      .small { font: 600 13px Arial, sans-serif; fill: #334e68; text-anchor: middle; dominant-baseline: middle; }
      .edge { font: 700 13px Arial, sans-serif; fill: #52606d; }
      .note { font: 600 13px Arial, sans-serif; fill: #52606d; }
    </style>
  </defs>
  <rect width="1240" height="760" fill="#fff"/>
  <text x="620.0" y="40" class="title">Shared background capacity: admission of heavy background requests</text>
  <rect x="60" y="85" width="330" height="80" rx="10" class="box"/>
  <text x="225.0" y="105.0" class="label">Cron hook fires</text>
  <text x="225.0" y="125.0" class="small">storage, shortcode/block, usage index,</text>
  <text x="225.0" y="145.0" class="small">dashboard collection/composition/statistics</text>
  <rect x="870" y="85" width="310" height="80" rx="10" class="box"/>
  <text x="1025.0" y="115.0" class="label">Availability checks</text>
  <text x="1025.0" y="135.0" class="small">not counted: own process lock only</text>
  <rect x="60" y="215" width="330" height="90" rx="10" class="box"/>
  <text x="225.0" y="240.0" class="label">WorkerBudget::acquire()</text>
  <text x="225.0" y="260.0" class="small">nested call in the same request</text>
  <text x="225.0" y="280.0" class="small">reuses its slot (depth counter)</text>
  <path d="M 225.0 165 L 225.0 215" class="line"/>
  <polygon points="640,200.0 805.0,260 640,320.0 475.0,260" class="decision"/>
  <text x="640" y="250.5" class="label">GET_LOCK(slot i, 0)</text>
  <text x="640" y="269.5" class="label">free for i &lt; limit?</text>
  <path d="M 390 260.0 L 475 260" class="line"/>
  <text x="60" y="335" class="note" text-anchor="start">limit: 1–16, default 3, per network</text>
  <rect x="870" y="220" width="310" height="80" rx="10" class="warning"/>
  <text x="1025.0" y="250.0" class="label">No slot free</text>
  <text x="1025.0" y="270.0" class="small">WorkerRuntimeStats: postponed +1</text>
  <path d="M 805 260 L 870 260.0" class="line"/>
  <text x="820" y="250" class="edge">no</text>
  <rect x="870" y="345" width="310" height="80" rx="10" class="warning"/>
  <text x="1025.0" y="365.0" class="label">Exit unchanged</text>
  <text x="1025.0" y="385.0" class="small">cursor untouched, retry event</text>
  <text x="1025.0" y="405.0" class="small">after at least 60 s</text>
  <path d="M 1025.0 300 L 1025.0 345" class="line"/>
  <path d="M 1180 385.0 L 1215 385 L 1215 65 L 225 65 L 225.0 85" class="line"/>
  <text x="640" y="60" class="note" text-anchor="middle">retry: a new Cron request</text>
  <rect x="475" y="385" width="330" height="80" rx="10" class="phase"/>
  <text x="640.0" y="405.0" class="label">Slot reserved</text>
  <text x="640.0" y="425.0" class="small">token stored; occupied slots</text>
  <text x="640.0" y="445.0" class="small">counted for observed parallelism</text>
  <path d="M 640 320 L 640.0 385" class="line"/>
  <text x="650" y="352" class="edge">yes</text>
  <rect x="475" y="515" width="330" height="80" rx="10" class="phase"/>
  <text x="640.0" y="535.0" class="label">Process lock + bounded step</text>
  <text x="640.0" y="555.0" class="small">one slice / batch / asset,</text>
  <text x="640.0" y="575.0" class="small">then continuation is scheduled</text>
  <path d="M 640.0 465 L 640.0 515" class="line"/>
  <rect x="475" y="645" width="330" height="80" rx="10" class="phase"/>
  <text x="640.0" y="665.0" class="label">WorkerBudget::release()</text>
  <text x="640.0" y="685.0" class="small">RELEASE_LOCK with owner token;</text>
  <text x="640.0" y="705.0" class="small">disconnect also releases</text>
  <path d="M 640.0 595 L 640.0 645" class="line"/>
  <rect x="870" y="645" width="310" height="80" rx="10" class="box"/>
  <text x="1025.0" y="665.0" class="label">WorkerRuntimeStats</text>
  <text x="1025.0" y="685.0" class="small">runs, duration, peak memory,</text>
  <text x="1025.0" y="705.0" class="small">host/SAPI/limits (Environment page)</text>
  <path d="M 805 685.0 L 870 685.0" class="line"/>
  <text x="60" y="560" class="note" text-anchor="start">Locks are scoped by DB name, base prefix, network ID.</text>
  <text x="60" y="580" class="note" text-anchor="start">They need one primary server per connection:</text>
  <text x="60" y="600" class="note" text-anchor="start">no Galera multi-writer, no read/write split,</text>
  <text x="60" y="620" class="note" text-anchor="start">no connection-multiplexing proxy.</text>
</svg>
