<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Plugin and theme usage index flow</title>
  <desc id="desc">A run collects plugin and theme usage per website into staging tables and publishes each table completely. The optional static source analysis then processes one plugin or theme per Cron step. A cancellation ends the run while the last published index stays in use.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker>
    <style>
      .box { fill: #f4f8fb; stroke: #52606d; stroke-width: 2; }
      .phase { fill: #e7f5ef; stroke: #16803c; stroke-width: 2; }
      .warning { fill: #fff4e5; stroke: #b45309; stroke-width: 2; }
      .stop { fill: #fdecec; stroke: #b42318; stroke-width: 2; }
      .decision { fill: #edf2ff; stroke: #3b5bdb; stroke-width: 2; }
      .group { fill: none; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .line { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #b42318; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .label { font: 600 16px Arial, sans-serif; fill: #1f2933; text-anchor: middle; dominant-baseline: middle; }
      .title { font: 700 24px Arial, sans-serif; fill: #1f2933; text-anchor: middle; }
      .small { font: 600 13px Arial, sans-serif; fill: #334e68; text-anchor: middle; dominant-baseline: middle; }
      .edge { font: 700 13px Arial, sans-serif; fill: #52606d; }
      .note { font: 600 13px Arial, sans-serif; fill: #52606d; }
    </style>
  </defs>
  <rect width="1240" height="1060" fill="#fff"/>
  <text x="620.0" y="40" class="title">Plugin and theme usage index: run, publication and cancellation</text>
  <rect x="60" y="75" width="300" height="70" rx="10" class="box"/>
  <text x="210.0" y="90.0" class="label">Start of a run</text>
  <text x="210.0" y="110.0" class="small">schedule (twice weekly), manual start,</text>
  <text x="210.0" y="130.0" class="small">change of network-active plugins</text>
  <rect x="470" y="75" width="300" height="70" rx="10" class="box"/>
  <text x="620.0" y="90.0" class="label">startRun()</text>
  <text x="620.0" y="110.0" class="small">new run_id, clear staging tables</text>
  <text x="620.0" y="130.0" class="small">and pending continuations</text>
  <path d="M 360 110.0 L 470 110.0" class="line"/>
  <rect x="880" y="75" width="300" height="70" rx="10" class="stop"/>
  <text x="1030.0" y="90.0" class="label">Cancel (Monitoring)</text>
  <text x="1030.0" y="110.0" class="small">status cancelled; continuations and</text>
  <text x="1030.0" y="130.0" class="small">retries removed; published index kept</text>
  <rect x="470" y="185" width="300" height="70" rx="10" class="box"/>
  <text x="620.0" y="200.0" class="label">Cron step on main site</text>
  <text x="620.0" y="220.0" class="small">worker slot (WorkerBudget)</text>
  <text x="620.0" y="240.0" class="small">and process lock</text>
  <path d="M 620.0 145 L 620.0 185" class="line"/>
  <rect x="880" y="185" width="300" height="70" rx="10" class="warning"/>
  <text x="1030.0" y="210.0" class="label">Capacity full or locked</text>
  <text x="1030.0" y="230.0" class="small">exit unchanged, retry after 60 s</text>
  <path d="M 770 220.0 L 880 220.0" class="line"/>
  <text x="795" y="210" class="edge">no slot</text>
  <path d="M 1030 255 L 1030 280 L 680 280 L 680 255" class="line"/>
  <rect x="40" y="305" width="1160" height="205" rx="14" class="group"/>
  <text x="54" y="498" class="note">Usage phases: relations only, no source files are read</text>
  <rect x="70" y="340" width="330" height="70" rx="10" class="phase"/>
  <text x="235.0" y="355.0" class="label">plugin_usage</text>
  <text x="235.0" y="375.0" class="small">active_plugins of N websites per step</text>
  <text x="235.0" y="395.0" class="small">into plugin_metrics_staging</text>
  <rect x="450" y="340" width="330" height="70" rx="10" class="phase"/>
  <text x="615.0" y="355.0" class="label">Publish plugin_metrics</text>
  <text x="615.0" y="375.0" class="small">DELETE + INSERT … SELECT</text>
  <text x="615.0" y="395.0" class="small">in one transaction</text>
  <rect x="830" y="340" width="330" height="70" rx="10" class="phase"/>
  <text x="995.0" y="355.0" class="label">theme_usage</text>
  <text x="995.0" y="375.0" class="small">stylesheet/template per website</text>
  <text x="995.0" y="395.0" class="small">into theme_metrics_staging</text>
  <path d="M 560 255 L 560 290 L 235 290 L 235.0 340" class="line"/>
  <path d="M 400 375.0 L 450 375.0" class="line"/>
  <path d="M 780 375.0 L 830 375.0" class="line"/>
  <rect x="830" y="430" width="330" height="50" rx="10" class="phase"/>
  <text x="995.0" y="455.0" class="label">Publish theme_metrics</text>
  <path d="M 995.0 410 L 995.0 430" class="line"/>
  <polygon points="995,530.0 1155.0,575 995,620.0 835.0,575" class="decision"/>
  <text x="995" y="565.5" class="label">Static source analysis</text>
  <text x="995" y="584.5" class="label">enabled?</text>
  <path d="M 995.0 480 L 995 530" class="line"/>
  <rect x="60" y="930" width="330" height="75" rx="10" class="phase"/>
  <text x="225.0" y="947.5" class="label">Run completed</text>
  <text x="225.0" y="967.5" class="small">status completed, finished_at;</text>
  <text x="225.0" y="987.5" class="small">detail caches invalidated</text>
  <path d="M 835 575 L 225 575 L 225.0 930" class="line"/>
  <text x="560" y="565" class="edge">no (default)</text>
  <rect x="410" y="640" width="790" height="250" rx="14" class="group"/>
  <text x="424" y="878" class="note">Optional source phases: one plugin or theme per Cron step</text>
  <rect x="440" y="665" width="330" height="85" rx="10" class="phase"/>
  <text x="605.0" y="687.5" class="label">plugin_sources / theme_sources</text>
  <text x="605.0" y="707.5" class="small">persist attempt, then analyse one asset;</text>
  <text x="605.0" y="727.5" class="small">unchanged fingerprint: copy result</text>
  <path d="M 995.0 620.0 L 995 645 L 605 645 L 605.0 665" class="line"/>
  <text x="1005" y="640" class="edge">yes</text>
  <rect x="830" y="665" width="340" height="85" rx="10" class="box"/>
  <text x="1000.0" y="687.5" class="label">Bounded analysis</text>
  <text x="1000.0" y="707.5" class="small">depth (default 3), PHP files (100),</text>
  <text x="1000.0" y="727.5" class="small">20 s, 5,000 files, 1 MiB/file, 32 MiB</text>
  <path d="M 770 707.5 L 830 707.5" class="line"/>
  <rect x="830" y="785" width="340" height="65" rx="10" class="warning"/>
  <text x="1000.0" y="807.5" class="label">Request aborted twice</text>
  <text x="1000.0" y="827.5" class="small">asset skipped, source error counted</text>
  <path d="M 1000.0 750 L 1000.0 785" class="line"/>
  <rect x="440" y="785" width="330" height="65" rx="10" class="phase"/>
  <text x="605.0" y="807.5" class="label">Publish *_source_metrics</text>
  <text x="605.0" y="827.5" class="small">after the last plugin / theme</text>
  <path d="M 605.0 750 L 605.0 785" class="line"/>
  <path d="M 440 817.5 L 225 817" class="line"/>
  <text x="440" y="930" class="note" text-anchor="start">Every progress write, publication and continuation first re-reads the run state</text>
  <text x="440" y="950" class="note" text-anchor="start">without object cache and stops when its run_id is no longer the active run.</text>
  <text x="440" y="970" class="note" text-anchor="start">A cancelled or restarted run therefore cannot be revived by a worker that is</text>
  <text x="440" y="990" class="note" text-anchor="start">still finishing its current step.</text>
</svg>
